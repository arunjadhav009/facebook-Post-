name: Generate Mandi Images Only

on:
  workflow_dispatch:
    inputs:
      html_list:
        description: 'JSON list of all HTML pages'
        required: true
        type: string

jobs:
  build-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Fonts and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-deva fonts-nakula fonts-sahadeva
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Run Generator Script
        env:
          INPUT_HTML_LIST: ${{ github.event.inputs.html_list }}
        run: |
          python generate_and_post.py
