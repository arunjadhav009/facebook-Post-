name: Generate Mandi Images Only

on:
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * *'

jobs:
  build-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Devanagari Fonts & Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-deva
          pip install pandas requests playwright
          playwright install --with-deps chromium

      - name: Run Generator Script
        run: python generate_and_post.py

      - name: Save Generated Images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mandi-Generated-Images
          path: output_images/
