name: Generate Mandi Images Only

on:
  workflow_dispatch:
    inputs:
      pages_json:
        description: 'Compact JSON data of mandi pages'
        required: true
        type: string

jobs:
  build-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Marathi Devanagari Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-deva fonts-nakula fonts-sahadeva fonts-lohit-deva
          # थेट Google Noto Sans Devanagari सिस्टीममध्ये इन्स्टॉल करणे
          mkdir -p ~/.local/share/fonts
          curl -s -L -o ~/.local/share/fonts/NotoSansDevanagari-Bold.ttf "https://github.com/google/fonts/raw/main/ofl/notosansdevanagari/NotoSansDevanagari%5Bwdth%2Cwght%5D.ttf"
          fc-cache -f -v
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Run Generator Script
        env:
          PAGES_JSON: ${{ github.event.inputs.pages_json }}
        run: |
          python generate_and_post.py
