name: Generate Mandi Images Only

on:
  workflow_dispatch:
    inputs:
      html_content:
        description: 'HTML Data from n8n'
        required: false
        default: ''

jobs:
  build-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Fonts and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-deva
          pip install playwright pandas requests
          playwright install --with-deps chromium

      - name: Run Generator Script
        env:
          INPUT_HTML: ${{ github.event.inputs.html_content }}
        run: python generate_and_post.py

      - name: Save Generated Images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mandi-Generated-Images
          path: output_images/
