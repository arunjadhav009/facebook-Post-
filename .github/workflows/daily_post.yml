name: Generate Mandi Images Only

on:
  workflow_dispatch:
    inputs:
      pages_json:
        description: 'Compact JSON data of mandi pages'
        required: true
        type: string

jobs:
  build-images:
    runs-on: ubuntu-latest

    # जुने रन्स डिलीट करण्यासाठी लागणाऱ्या परवानग्या
    permissions:
      actions: write
      contents: read

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Pure Devanagari Unicode Fonts
        run: |
          sudo apt-get update
          sudo apt-get remove -y fonts-nakula fonts-sahadeva || true
          sudo apt-get install -y fonts-noto-core fonts-noto-extra fonts-noto-ui-core
          mkdir -p ~/.local/share/fonts
          curl -s -L -o ~/.local/share/fonts/NotoSansDevanagari-Bold.ttf "https://raw.githubusercontent.com/googlefonts/noto-fonts/main/hinted/ttf/NotoSansDevanagari/NotoSansDevanagari-Bold.ttf"
          curl -s -L -o ~/.local/share/fonts/NotoSansDevanagari-Regular.ttf "https://raw.githubusercontent.com/googlefonts/noto-fonts/main/hinted/ttf/NotoSansDevanagari/NotoSansDevanagari-Regular.ttf"
          fc-cache -f -v
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Run Generator Script
        env:
          PAGES_JSON: ${{ github.event.inputs.pages_json }}
        run: |
          python generate_and_post.py

      # यशस्वी झाल्यानंतर फक्त शेवटचे ३ रन्स ठेवून बाकीचे जुने रन्स डिलीट करणे
      - name: Clean Old Workflow Runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_minimum_runs: 3
          keep_minimum_runs: 3
