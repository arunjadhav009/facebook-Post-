name: Generate Mandi Images Only

on:
  workflow_dispatch:
    inputs:
      html_content:
        description: 'HTML Data from n8n'
        required: true
      webhook_url:
        description: 'n8n Webhook URL'
        required: false
        default: ''

jobs:
  build-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Fonts and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-deva
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Run Generator Script
        env:
          INPUT_HTML: ${{ github.event.inputs.html_content }}
          N8N_WEBHOOK_URL: ${{ github.event.inputs.webhook_url }}
        run: python generate_and_post.py
